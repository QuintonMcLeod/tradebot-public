# ──────────────────────────────────────────────────────────────
# TradeBot SCI — GitLab CI Pipeline
# ──────────────────────────────────────────────────────────────
# Runs lint + type-check + test on every push and merge request.
# Uses Poetry for dependency management, Ruff for linting,
# mypy for type checking, and pytest for testing.
#
# The build stage packages the Linux AppImage so releases are produced by CI
# rather than by hand. See scripts/build_appimage.sh for what it runs.
#
# NOTE: GitLab only reads the .gitlab-ci.yml at the repository root. This file
# lives at the root of the public mirror (gitlab.com/ultraedge/tradebot-public)
# and is published there by scripts/publish_mirror.sh. In the private monorepo it
# sits in a subdirectory and is not used.

stages:
  - lint
  - test
  - build

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  POETRY_VIRTUALENVS_IN_PROJECT: "true"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .pip-cache/
    - .venv/

# ── Lint (ruff check + format) ───────────────────────────────
# NOTE: allow_failure is set because ~3,000 pre-existing lint errors
# exist across the codebase. Remove this once the lint debt is cleared.
lint:
  stage: lint
  image: python:3.13-slim
  before_script:
    - pip install --quiet ruff
  script:
    - ruff check src/ tests/
    - ruff format --check src/
  allow_failure: true

# ── Type Check (mypy --strict) ───────────────────────────────
# NOTE: allow_failure is set because mypy --strict reports pre-existing errors
# across the codebase (market/trend_consensus.py, server/ws_server.py,
# market/synthetic_provider.py and others). Leaving it non-optional fails the
# pipeline and, because the failure lands in this stage, the test job never runs.
# Remove this once the type debt is cleared.
typecheck:
  stage: lint
  image: python:3.13-slim
  before_script:
    - pip install --quiet poetry
    - poetry install --no-interaction --no-root
  script:
    - poetry run mypy src/tradebot_sci --strict --no-error-summary
  allow_failure: true

# ── Unit, Integration, Property & Degradation Tests ──────────
# PYTHONPATH is set because installs use `poetry install --no-root`, so the
# tradebot_sci package itself is never installed into the environment and tests
# fail with ModuleNotFoundError. This mirrors scripts/tradebot.sh, which also
# runs the bot with PYTHONPATH=src rather than an installed package.
test:
  stage: test
  image: python:3.13-slim
  variables:
    PYTHONPATH: "src"
  before_script:
    - pip install --quiet poetry
    - poetry install --no-interaction --no-root
  script:
    - poetry run pytest tests/ -x -q --tb=short
    - poetry run pytest tests/ --cov=tradebot_sci --cov-fail-under=80
  artifacts:
    when: on_failure
    paths:
      - .pytest_cache/
    expire_in: 7 days

# ── Build the Linux AppImage ─────────────────────────────────
# Runs on every branch and tag. The build logic lives in
# scripts/build_appimage.sh so it can be reproduced locally with the same
# command; nothing here should need editing when the build changes.
build:appimage:
  stage: build
  image: node:22-bookworm
  # Start immediately: lint is advisory (allow_failure) and the test job is slow,
  # so there is no reason to gate the artifact behind them.
  needs: []
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends libarchive-tools zsync ca-certificates
  script:
    - bash scripts/build_appimage.sh
    # Hand the download URL to the release job. GitLab's /-/jobs/artifacts/<ref>/raw/
    # route 404s on this project, so the release links to the job artifact download
    # (verified 200 anonymously) rather than a path-based URL.
    - echo "APPIMAGE_URL=$CI_PROJECT_URL/-/jobs/$CI_JOB_ID/artifacts/download" > build.env
  artifacts:
    name: "tradebot-sci-appimage-$CI_COMMIT_SHORT_SHA"
    paths:
      - dist/*.AppImage
    reports:
      dotenv: build.env
    expire_in: 30 days

# ── Build the Windows self-extracting setup ──────────────────
# A self-extracting archive is a stub with a 7-Zip payload appended, so it builds
# on Linux and needs no Windows toolchain. That is why this job can exist at all.
build:windows-sfx:
  stage: build
  image: node:22-bookworm
  needs: []
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends p7zip-full rsync
  script:
    - bash scripts/build_windows_sfx.sh
    - echo "WINDOWS_URL=$CI_PROJECT_URL/-/jobs/$CI_JOB_ID/artifacts/download" > build.env
  artifacts:
    name: "tradebot-sci-windows-$CI_COMMIT_SHORT_SHA"
    paths:
      - dist/*.exe
    reports:
      dotenv: build.env
    expire_in: 30 days

# ── Publish a Release with both installers attached ──────────
# Runs on tags such as v3.0.30 and produces a permanent download page. The download
# URLs come from the build jobs as dotenv reports, so the release never has to
# guess a filename or a job id.
release:
  stage: build
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: build:appimage
      artifacts: false
    - job: build:windows-sfx
      artifacts: false
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - VERSION="$(cat VERSION | tr -d '[:space:]')"
    - echo "Publishing release $CI_COMMIT_TAG for version $VERSION"
    - echo "  AppImage: $APPIMAGE_URL"
    - echo "  Windows : $WINDOWS_URL"
    - |
      release-cli create \
        --name "Tradebot SCI $CI_COMMIT_TAG" \
        --tag-name "$CI_COMMIT_TAG" \
        --description "Automated release for $CI_COMMIT_TAG (v$VERSION). Both downloads are ZIP archives containing the installer." \
        --assets-link "{\"name\":\"Linux AppImage (x86_64, .zip)\",\"url\":\"$APPIMAGE_URL\",\"link_type\":\"package\"}" \
        --assets-link "{\"name\":\"Windows Setup (x86_64, .zip)\",\"url\":\"$WINDOWS_URL\",\"link_type\":\"package\"}"

